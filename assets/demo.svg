<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400">
<style>
  .f { font-family: 'SFMono-Regular','Menlo','Monaco','Consolas','Liberation Mono','Courier New',monospace; font-size: 12.5px; }
  .l { opacity: 0; }
  @keyframes sh { from { opacity: 0; } to { opacity: 1; } }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }

  .l1  { animation: sh .05s  .3s  forwards; }
  .l2  { animation: sh .05s  .48s forwards; }
  .l3  { animation: sh .05s  .62s forwards; }
  .l4  { animation: sh .05s  .76s forwards; }
  .l5  { animation: sh .05s  .90s forwards; }
  .l6  { animation: sh .05s 1.05s forwards; }
  .l7  { animation: sh .05s 1.45s forwards; }
  .l8  { animation: sh .05s 1.80s forwards; }
  .l9  { animation: sh .05s 2.10s forwards; }
  .l10 { animation: sh .05s 2.30s forwards; }
  .l11 { animation: sh .05s 2.50s forwards; }
  .l12 { animation: sh .05s 2.85s forwards; }
  .l13 { animation: sh .05s 3.15s forwards; }
  .l14 { animation: sh .05s 3.30s forwards; }
  .l15 { animation: sh .05s 3.50s forwards; }
  .l16 { animation: sh .05s 3.70s forwards; }
  .l17 { animation: sh .05s 3.90s forwards; }
  .l18 { animation: sh .05s 4.10s forwards; }
  .cur { opacity: 0; animation: sh .05s 4.20s forwards, blink .8s 4.20s step-end infinite; }
</style>

<!-- Window -->
<rect width="700" height="400" rx="10" fill="#1e1e2e"/>

<!-- Title bar -->
<rect width="700" height="32" rx="10" fill="#313244"/>
<rect y="20" width="700" height="12" fill="#313244"/>
<text class="f" x="350" y="21" text-anchor="middle" fill="#6c7086" font-size="11">claude-tracking — bash</text>
<circle cx="20" cy="16" r="5.5" fill="#f38ba8"/>
<circle cx="40" cy="16" r="5.5" fill="#f9e2af"/>
<circle cx="60" cy="16" r="5.5" fill="#a6e3a1"/>

<!-- ASCII art: AI BASE (line-height 16px, starts y=56) -->
<text class="f l l1" x="18" y="56"  fill="#89b4fa">  █████╗ ██╗    ██████╗  █████╗ ███████╗███████╗</text>
<text class="f l l2" x="18" y="72"  fill="#89b4fa"> ██╔══██╗██║    ██╔══██╗██╔══██╗██╔════╝██╔════╝</text>
<text class="f l l3" x="18" y="88"  fill="#89b4fa"> ███████║██║    ███████╔╝███████║███████╗█████╗  </text>
<text class="f l l4" x="18" y="104" fill="#89b4fa"> ██╔══██║██║    ██╔══██╗██╔══██║╚════██║██╔══╝  </text>
<text class="f l l5" x="18" y="120" fill="#89b4fa"> ██║  ██║██║    ██████╔╝██║  ██║███████║███████╗</text>
<text class="f l l6" x="18" y="136" fill="#89b4fa"> ╚═╝  ╚═╝╚═╝   ╚═════╝ ╚═╝  ╚═╝╚══════╝╚══════╝</text>

<!-- Subtitle -->
<text class="f l l7" x="18" y="160" fill="#6c7086">  AI developer tools — tracking · history · diagnostics</text>

<!-- Command 1 -->
<text class="f l l8" x="18" y="184"><tspan fill="#a6e3a1">❯</tspan><tspan fill="#cdd6f4"> python3 sys/claude_tracking.py status</tspan></text>

<!-- Status output -->
<text class="f l l9"  x="18" y="200"><tspan fill="#89dceb">Hooks :</tspan><tspan fill="#a6e3a1"> installed</tspan><tspan fill="#6c7086"> (PostToolUse, Stop)</tspan></text>
<text class="f l l10" x="18" y="216"><tspan fill="#89dceb">DB    :</tspan><tspan fill="#cdd6f4"> ~/.claude-tracking/claude-tracking.db</tspan></text>
<text class="f l l11" x="18" y="232"><tspan fill="#6c7086">        sessions=</tspan><tspan fill="#f9e2af">47</tspan><tspan fill="#6c7086">  turns=</tspan><tspan fill="#f9e2af">312</tspan><tspan fill="#6c7086">  tool_calls=</tspan><tspan fill="#f9e2af">1840</tspan></text>

<!-- Command 2 -->
<text class="f l l12" x="18" y="256"><tspan fill="#a6e3a1">❯</tspan><tspan fill="#cdd6f4"> python3 sys/claude_tracking.py tools</tspan></text>

<!-- Tools output -->
<text class="f l l13" x="18" y="272" fill="#6c7086">tool_name    calls   avg_ms   total_ms</text>
<text class="f l l14" x="18" y="288" fill="#6c7086">─────────    ─────   ──────   ────────</text>
<text class="f l l15" x="18" y="304"><tspan fill="#cdd6f4">Bash         </tspan><tspan fill="#f9e2af">142</tspan><tspan fill="#cdd6f4">     </tspan><tspan fill="#f9e2af">312.5</tspan><tspan fill="#cdd6f4">    </tspan><tspan fill="#f9e2af">44375.0</tspan></text>
<text class="f l l16" x="18" y="320"><tspan fill="#cdd6f4">Read          </tspan><tspan fill="#f9e2af">98</tspan><tspan fill="#cdd6f4">      </tspan><tspan fill="#f9e2af">18.3</tspan><tspan fill="#cdd6f4">     </tspan><tspan fill="#f9e2af">1793.4</tspan></text>
<text class="f l l17" x="18" y="336"><tspan fill="#cdd6f4">Edit          </tspan><tspan fill="#f9e2af">67</tspan><tspan fill="#cdd6f4">      </tspan><tspan fill="#f9e2af">24.1</tspan><tspan fill="#cdd6f4">     </tspan><tspan fill="#f9e2af">1614.7</tspan></text>

<!-- Final prompt + blinking cursor -->
<text class="f l l18" x="18" y="360" fill="#a6e3a1">❯</text>
<rect class="cur" x="30" y="345" width="7.5" height="15" fill="#cdd6f4"/>
</svg>
